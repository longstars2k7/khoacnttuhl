<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THÔNG BÁO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background-color: white;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
    }

    h2 {
      font-size: 24px;
      text-align: center;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #1e88e5;
    }

    .form-group .error {
      color: red;
      font-size: 13px;
      margin-top: 5px;
      display: none;
    }

    .form-group input.invalid {
      border-color: red;
    }

    .captcha-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #e3f2fd;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
      font-weight: bold;
      letter-spacing: 3px;
      color: #1976d2;
      user-select: none;
    }

    #refresh-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #1976d2;
      font-size: 20px;
      padding: 0;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      border: none;
      background-color: #1e88e5;
      color: white;
      font-weight: bold;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .login-btn:hover {
      background-color: #1565c0;
    }

    #toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #f44336;
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      display: none;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 999;
    }

    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 1,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }
    .logo {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 10px auto 20px auto;
}
@media (max-width: 768px) {
  .login-box {
    padding: 20px;
    margin: 10px;
  }

  h2 {
    font-size: 24px;
  }

  h3 {
    font-size: 16px;
  }

  p {
    font-size: 18px;
  }
}

  </style>
</head>
<body>
  <div class="login-box">
    <img src="img/cntt_uhl.png" alt="Logo" class="logo">
    <h2 style="color:#4462a7">THÔNG BÁO</h2>
    <div class="form-group">
      <h3> Tính năng này đang được phát triển. <br>
      Vui lòng thử lại sau. </h3>
    </div>
    <p style="margin-top:10px; font-size:18px; color: red; font-weight:bold;">
  Hệ thống tự động quay lại Trang chủ sau <span id="time">10</span> giây.
</p>
  </div>
</body>

<script>
  let time = 10;
  const el = document.getElementById("time");

  const timer = setInterval(() => {
    time--;
    el.textContent = time;

    if (time <= 0) {
      clearInterval(timer);
      window.location.href = "captcha/login_new.html";
    }
  }, 1000);
</script>

</html>
